<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AEGIS // 云端日志管理后台</title>
  <style>
    body { background: #090d16; color: #fff; font-family: monospace; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #1f2937; padding: 12px; text-align: left; font-size: 13px; }
    th { background: #111827; color: #9ca3af; }
    img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; }
    .ip-tag { background: #1e293b; color: #38bdf8; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>📸 抓拍日志 & 访客 IP 管理后台</h2>
  <button onclick="fetchLogs()" style="background:#2563eb; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">🔄 刷新数据</button>

  <table>
    <thead>
      <tr>
        <th>抓拍照片</th>
        <th>登录账号</th>
        <th>访客 IP 地址</th>
        <th>国家/地区</th>
        <th>抓拍时间</th>
      </tr>
    </thead>
    <tbody id="logTable">
      <tr><td colspan="5" style="text-align: center;">⏳ 正在加载...</td></tr>
    </tbody>
  </table>

  <script>
    // ⚠️ 替换成你自己的 Worker URL
    const WORKER_URL = "https://face-logger.bmk4byvf9b.workers.dev";

    async function fetchLogs() {
      const tbody = document.getElementById('logTable');
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">📭 暂无数据（请先在前端登录一次）</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(log => `
          <tr>
            <td><img src="${log.photo || ''}"></td>
            <td>${log.email || '未知'}</td>
            <td><span class="ip-tag">${log.ip || '未知 IP'}</span></td>
            <td>${log.country || '未知'}</td>
            <td>${log.timestamp || '未知'}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">❌ 读取失败: ${e.message}</td></tr>`;
      }
    }

    fetchLogs();
  </script>
</body>
</html>
