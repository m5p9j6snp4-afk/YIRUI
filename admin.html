<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geek Market - 管理后台</title>
  <style>
    :root { --bg: #0b0f19; --card-bg: #111827; --accent: #2563eb; --text: #f3f4f6; --text-muted: #9ca3af; --border: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; display: none; } /* 默认隐藏，密码正确后显示 */
    h1 { font-size: 20px; margin-bottom: 20px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
    .stat-title { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .stat-value { font-size: 22px; font-weight: bold; color: #38bdf8; }
    .section-title { font-size: 16px; margin: 25px 0 15px 0; border-left: 3px solid var(--accent); padding-left: 8px; }
    .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
    th { background: #1f2937; color: var(--text-muted); }
    tr:hover { background: rgba(255,255,255,0.02); }
    .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); background: #000; }
    .btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn:hover { background: #1d4ed8; }
    
    /* 密码登录弹窗样式 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border); padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
  </style>
</head>
<body>

  <!-- 后台登录验证弹窗 -->
  <div class="modal-overlay" id="loginModal">
    <div class="auth-card">
      <h3 style="margin-bottom: 10px; color: #38bdf8;">🛡️ 后台安全验证</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">请输入管理密码以查看抓拍日志</p>
      <div class="input-group">
        <label>管理密码</label>
        <input type="password" id="pwdInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter') verifyPwd()">
      </div>
      <button class="btn" style="width: 100%; padding: 10px;" onclick="verifyPwd()">确认进入</button>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <h1>
      <span>🛡️ GEEK-MARKET 管理后台</span>
      <button class="btn" onclick="loadAdminData()">🔄 刷新数据</button>
    </h1>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-title">总抓拍访问量</div>
        <div class="stat-value" id="statCount">0</div>
      </div>
    </div>

    <div class="section-title">👤 访客抓拍与登录日志</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>抓拍照片</th>
            <th>电子邮箱</th>
            <th>IP 地址</th>
            <th>国家/地区</th>
            <th>访问时间</th>
          </tr>
        </thead>
        <tbody id="logsTableBody">
          <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">正在加载日志...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://api.yirui.uk";
    const ADMIN_PASSWORD = "admin888"; // 👈 在这里修改你的后台管理密码

    function verifyPwd() {
      const inputVal = document.getElementById('pwdInput').value;
      if (inputVal === ADMIN_PASSWORD) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
        loadAdminData();
      } else {
        alert("❌ 密码错误！");
        document.getElementById('pwdInput').value = "";
      }
    }

    async function loadAdminData() {
      const tbody = document.getElementById('logsTableBody');
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">⏳ 正在同步云端数据...</td></tr>`;

      try {
        const res = await fetch(`${WORKER_URL}?type=logs`);
        if (!res.ok) throw new Error(`HTTP 错误: ${res.status}`);
        
        const logs = await res.json();
        document.getElementById('statCount').innerText = logs.length;

        if (!logs || logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">暂无访客抓拍记录</td></tr>`;
          return;
        }

        let html = '';
        logs.forEach(log => {
          const photoHtml = log.photo ? `<img src="${log.photo}" class="thumb">` : `<span style="color:var(--text-muted);">无照片</span>`;
          html += `
            <tr>
              <td>${photoHtml}</td>
              <td>${log.email || '未填写'}</td>
              <td>${log.ip || '未知'}</td>
              <td>${log.country || '未知'}</td>
              <td>${log.timestamp || '未知'}</td>
            </tr>`;
        });
        tbody.innerHTML = html;

      } catch (e) {
        console.error("加载后台日志失败", e);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171;">❌ 加载失败: ${e.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
