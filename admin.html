<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS // Admin Biometric Logs Control</title>
  <style>
    :root { --bg: #090d16; --panel: #111827; --border: #1f2937; --text: #f9fafb; --accent: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    h1 { font-size: 20px; font-family: monospace; color: var(--accent); }
    .btn-clear { padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    /* 照片记录网格布局 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .log-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .photo-box { width: 100%; height: 200px; background: #000; display: flex; justify-content: center; align-items: center; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .info-box { padding: 14px; font-size: 12px; font-family: monospace; }
    .info-email { font-weight: bold; color: #fff; margin-bottom: 4px; }
    .info-time { color: #9ca3af; }
    .empty-tip { text-align: center; color: #6b7280; padding: 60px; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>[AEGIS ADMIN] 登录人脸识别抓拍日志</h1>
    <button class="btn-clear" onclick="clearLogs()">清空所有抓拍记录</button>
  </header>

  <div class="grid" id="logsContainer"></div>

  <script>
    function loadLogs() {
      const container = document.getElementById('logsContainer');
      const logs = JSON.parse(localStorage.getItem("ADMIN_FACE_LOGS") || "[]");

      if (logs.length === 0) {
        container.innerHTML = `<div class="empty-tip">暂无任何人脸登录抓拍记录</div>`;
        return;
      }

      container.innerHTML = logs.map(item => `
        <div class="log-card">
          <div class="photo-box">
            <img src="${item.photo}" alt="Captured Face" />
          </div>
          <div class="info-box">
            <div class="info-email">USER: ${item.email}</div>
            <div class="info-time">TIME: ${item.timestamp}</div>
          </div>
        </div>
      `).join('');
    }

    function clearLogs() {
      if (confirm("确定要清空所有后台抓拍照片记录吗？")) {
        localStorage.removeItem("ADMIN_FACE_LOGS");
        loadLogs();
      }
    }

    loadLogs();
  </script>
</body>
</html>
