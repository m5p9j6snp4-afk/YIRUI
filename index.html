<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTRICTED TERMINAL // ACCESS CONTROL</title>
  <style>
    :root {
      --bg-dark: #05070f;
      --card-bg: rgba(12, 16, 32, 0.85);
      --cyan: #00f3ff;
      --green: #00ff66;
      --text: #e2e8f0;
      --font-code: 'Courier New', Courier, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .auth-card {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15);
    }
    .card-header {
      font-family: var(--font-code);
      font-size: 13px;
      color: var(--cyan);
      margin-bottom: 20px;
      border-bottom: 1px dashed rgba(0, 243, 255, 0.2);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .layer-step { display: none; }
    .layer-step.active { display: block; }
    .layer-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 6px; }
    .layer-desc { font-size: 12px; color: #64748b; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-family: var(--font-code); font-size: 11px; color: var(--cyan); margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 6px; color: #fff;
      font-family: var(--font-code); outline: none;
    }
    .cyber-btn {
      width: 100%; padding: 12px; background: transparent; border: 1px solid var(--cyan);
      color: var(--cyan); font-family: var(--font-code); font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .scan-circle {
      width: 100px; height: 100px; margin: 20px auto; border: 2px dashed var(--cyan);
      border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer;
    }
    .scan-line {
      width: 100%; height: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
      position: absolute; top: 0; display: none; animation: scan 1.2s infinite alternate ease-in-out;
    }
    .scanning .scan-line { display: block; }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="card-header">
      <span id="layerIndicator">SECURITY // LAYER 1/3</span>
      <span style="color: var(--green);">● SYSTEM ONLINE</span>
    </div>

    <!-- 第一层 -->
    <div class="layer-step active" id="layer1">
      <div class="layer-title">第一层验证：凭证识别</div>
      <div class="layer-desc">请输入您的机密访问账号与量子密钥</div>
      <div class="form-group">
        <label class="form-label">IDENTITY HANDLE</label>
        <input type="text" class="form-input" id="username" placeholder="输入代号" value="Neo_01">
      </div>
      <div class="form-group">
        <label class="form-label">ACCESS KEY</label>
        <input type="password" class="form-input" id="password" value="123456">
      </div>
      <button class="cyber-btn" onclick="nextLayer(2)">验证基础凭证 ➔</button>
    </div>

    <!-- 第二层 -->
    <div class="layer-step" id="layer2">
      <div class="layer-title">第二层验证：动态安全码</div>
      <div class="layer-desc">请输入 6 位动态验证码（测试码：888888）</div>
      <div class="form-group">
        <label class="form-label">OTP SECURITY CODE</label>
        <input type="text" class="form-input" id="otpCode" placeholder="6 位验证码" maxlength="6">
      </div>
      <button class="cyber-btn" onclick="verifyOTP()">提交动态密钥 ➔</button>
    </div>

    <!-- 第三层 -->
    <div class="layer-step" id="layer3">
      <div class="layer-title">第三层验证：生物特征扫描</div>
      <div class="layer-desc">点击下方扫描核心，触发生物特征与信标校验</div>
      <div class="scan-circle" id="scanCircle" onclick="triggerScan()">
        <div class="scan-line"></div>
        <span style="font-family: var(--font-code); font-size: 11px; color: var(--cyan);">[ 点击扫描 ]</span>
      </div>
      <div id="scanStatus" style="text-align: center; font-family: var(--font-code); font-size: 12px; color: var(--cyan);">等待生物触控...</div>
    </div>
  </div>

  <script>
    // 检查如果已经登录，直接跳到 dashboard
    if (localStorage.getItem("SECURE_AUTH_TOKEN") === "GRANTED_LEVEL_ROOT") {
      window.location.href = "dashboard.html";
    }

    function nextLayer(layerNum) {
      document.querySelectorAll('.layer-step').forEach(p => p.classList.remove('active'));
      document.getElementById('layer' + layerNum).classList.add('active');
      document.getElementById('layerIndicator').innerText = `SECURITY // LAYER ${layerNum}/3`;
    }

    function verifyOTP() {
      const otp = document.getElementById('otpCode').value;
      if (otp === "888888") {
        nextLayer(3);
      } else {
        alert("动态安全码错误！（测试请输入：888888）");
      }
    }

    function triggerScan() {
      const circle = document.getElementById('scanCircle');
      const status = document.getElementById('scanStatus');
      circle.classList.add('scanning');
      status.innerText = "正在扫描生物特征...";

      setTimeout(() => {
        circle.classList.remove('scanning');
        status.innerText = "【授权通过】正在解密系统...";
        status.style.color = "var(--green)";
        
        // 存入凭证并跳转
        localStorage.setItem("SECURE_AUTH_TOKEN", "GRANTED_LEVEL_ROOT");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      }, 1500);
    }
  </script>
</body>
</html>
