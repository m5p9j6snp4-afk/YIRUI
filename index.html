<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity & Access Management // Secure Gateway</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --border: #1f2937;
      --border-focus: #3b82f6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .brand-icon { width: 12px; height: 12px; background: var(--accent); border-radius: 2px; }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      margin: auto 0;
    }

    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

    .stepper { display: flex; gap: 6px; margin-bottom: 24px; }
    .step-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; transition: background 0.3s; }
    .step-bar.active { background: var(--accent); }
    .step-bar.completed { background: var(--success); }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }

    input {
      width: 100%; padding: 10px 14px; background: #0d1117;
      border: 1px solid var(--border); border-radius: 6px; color: #fff;
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--border-focus); }

    .btn {
      width: 100%; padding: 11px; background: var(--accent);
      color: #fff; border: none; border-radius: 6px; font-size: 14px;
      font-weight: 500; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }

    .step-content { display: none; }
    .step-content.active { display: block; }

    /* 真实摄像头人脸识别 UI */
    .camera-container {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 镜像翻转，符合人脸自拍习惯 */
    }

    /* 扫脸框 overlays */
    .face-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 130px;
      height: 160px;
      border: 2px dashed var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* 压暗周围 */
      pointer-events: none;
      transition: border-color 0.3s;
    }

    .face-overlay.success {
      border-color: var(--success);
      border-style: solid;
      box-shadow: 0 0 15px var(--success), 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      top: 0;
      animation: scanAnim 1.5s infinite alternate ease-in-out;
      display: none;
    }

    @keyframes scanAnim {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    .audit-box {
      background: #000; border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; font-family: var(--font-mono);
      font-size: 11px; color: #6b7280; height: 90px; overflow-y: auto; margin-top: 16px;
    }

    .log-line { margin-bottom: 4px; }
    .log-line.info { color: #9ca3af; }
    .log-line.success { color: var(--success); }
    .log-line.error { color: var(--danger); }

    .footer { font-size: 12px; color: #4b5563; text-align: center; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon"></div>
      <span>AEGIS ZERO-TRUST GATEWAY</span>
    </div>
    <div>GATEWAY ID: <span style="font-family: var(--font-mono);">us-east-1a-gw02</span></div>
  </header>

  <div class="auth-card">
    <div class="card-title" id="displayTitle">访问鉴权 (1/3)</div>
    <div class="card-subtitle" id="displaySub">请输入您的 Enterprise SSO 凭证</div>

    <div class="stepper">
      <div class="step-bar active" id="bar1"></div>
      <div class="step-bar" id="bar2"></div>
      <div class="step-bar" id="bar3"></div>
    </div>

    <!-- 步骤 1：账号与密码 -->
    <div class="step-content active" id="step1">
      <div class="form-group">
        <label>CORPORATE EMAIL / DOMAIN ID</label>
        <input type="text" id="email" value="alex.chen@aegis-tech.internal">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" value="••••••••••••">
      </div>
      <button class="btn" onclick="Gateway.submitStep1()">下一步：动态令牌校验</button>
    </div>

    <!-- 步骤 2：动态验证码 -->
    <div class="step-content" id="step2">
      <div class="form-group">
        <label>HARDWARE TOKEN / TOTP CODE (测试输入: 888888)</label>
        <input type="text" id="totp" placeholder="6-digit code" maxlength="6" style="font-family: var(--font-mono); letter-spacing: 4px; text-align: center;">
      </div>
      <button class="btn" onclick="Gateway.submitStep2()">校验动态安全协议</button>
    </div>

    <!-- 步骤 3：真实人脸识别认证 -->
    <div class="step-content" id="step3">
      <div class="camera-container">
        <!-- 摄像头画面 -->
        <video id="webcam" autoplay playsinline muted></video>
        <!-- 人脸取景框与扫描线 -->
        <div class="face-overlay" id="faceOverlay">
          <div class="scan-line" id="scanLine"></div>
        </div>
      </div>
      <button class="btn" id="camBtn" onclick="Gateway.startFaceScan()">启动人脸生物识别</button>
    </div>

    <div class="audit-box" id="auditLog">
      <div class="log-line info">[SYS-INIT] Gateway connection established.</div>
      <div class="log-line info">[SEC-CHECK] TLS 1.3 Cipher Suite Verified.</div>
    </div>
  </div>

  <footer class="footer">
    Protected by Aegis Security Engine | Zero Trust Compliance Level 4
  </footer>

  <script>
    const Gateway = {
      step: 1,
      stream: null,

      log(msg, type = 'info') {
        const box = document.getElementById('auditLog');
        const time = new Date().toISOString().split('T')[1].slice(0, 8);
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        line.innerText = `[${time}] ${msg}`;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
      },

      updateUI(step, title, sub) {
        this.step = step;
        document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`step${step}`).classList.add('active');
        
        document.getElementById('displayTitle').innerText = title;
        document.getElementById('displaySub').innerText = sub;

        document.getElementById(`bar${step}`).classList.add('active');
        if (step > 1) document.getElementById(`bar${step-1}`).classList.add('completed');
      },

      submitStep1() {
        const email = document.getElementById('email').value;
        if (!email) return alert("请输入完整的域账号！");

        this.log(`Attempting SSO authentication for ${email}...`);
        setTimeout(() => {
          this.log(`[PASS] Primary credentials valid.`, 'success');
          this.updateUI(2, "访问鉴权 (2/3)", "检测到二次因素验证 (2FA) 策略要求");
        }, 400);
      },

      submitStep2() {
        const code = document.getElementById('totp').value;
        if (code === "888888") {
          this.log(`[PASS] TOTP token signature verified.`, 'success');
          this.updateUI(3, "访问鉴权 (3/3)", "需要完成实时人脸生物识别比对");
          this.initCamera(); // 自动请求开启摄像头
        } else {
          this.log(`[ERR] Invalid TOTP token signature.`, 'error');
          alert("动态安全码无效！（测试请输入：888888）");
        }
      },

      // 1. 调用系统原生的摄像头权限
      async initCamera() {
        try {
          this.log(`Requesting camera permission...`);
          this.stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
          });
          const video = document.getElementById('webcam');
          video.srcObject = this.stream;
          this.log(`[SYS] Camera stream active (Live).`, 'info');
        } catch (err) {
          this.log(`[ERR] Camera access denied: ${err.message}`, 'error');
          alert("无法开启摄像头：请允许网站使用摄像头权限才能完成认证。");
        }
      },

      // 2. 模拟实时扫脸与特征捕获过程
      startFaceScan() {
        if (!this.stream) {
          alert("摄像头尚未准备就绪，请刷新重试并允许摄像头权限。");
          return;
        }

        const btn = document.getElementById('camBtn');
        const overlay = document.getElementById('faceOverlay');
        const scanLine = document.getElementById('scanLine');

        btn.disabled = true;
        btn.innerText = "正在提取生物特征点...";
        scanLine.style.display = "block";
        this.log(`Extracting facial landmarks & depth map...`);

        // 模拟扫脸识别过程 (2.5秒)
        setTimeout(() => {
          scanLine.style.display = "none";
          overlay.classList.add('success');
          btn.innerText = "人脸匹配成功 100%";
          btn.style.background = "var(--success)";
          
          this.log(`[PASS] Biometric face mesh match confidence: 99.8%`, 'success');

          // 识别成功后关闭摄像头，准备进入
          setTimeout(() => {
            if (this.stream) {
              this.stream.getTracks().forEach(track => track.stop()); // 关掉摄像头灯
            }
            // 使用 sessionStorage：仅限当前标签页有效，刷新就会作废！
            sessionStorage.setItem("AUTHENTICATED_SESSION", "TRUE");
            window.location.href = "dashboard.html";
          }, 1000);

        }, 2500);
      }
    };

    // 核心修改：每次进入或刷新 index.html 时，清空认证，必须重验！
    sessionStorage.removeItem("AUTHENTICATED_SESSION");
  </script>
</body>
</html>
