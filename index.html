<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTRICTED TERMINAL // ACCESS CONTROL</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 网页背景矩阵与光效 -->
  <div class="bg-overlay"></div>

  <!-- 多层验证主容器 -->
  <main class="auth-container">
    
    <!-- 顶部状态栏 -->
    <header class="auth-header">
      <span id="layerTag">SECURITY LEVEL // 1/3</span>
      <span class="status-dot">● GATEWAY ACTIVE</span>
    </header>

    <!-- LAYER 1: 账号与密码 -->
    <section class="layer-step active" id="layer1">
      <h2>[ 01 ] 识别协议</h2>
      <p>请输入管理员代号与访问密钥</p>
      <div class="field">
        <label>IDENTITY HANDLE</label>
        <input type="text" id="username" placeholder="Admin/User Key" autocomplete="off">
      </div>
      <div class="field">
        <label>ACCESS KEY</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn" onclick="AuthSystem.verifyLayer1()">继续校验 ➔</button>
    </section>

    <!-- LAYER 2: 动态 2FA/OTP 校验 -->
    <section class="layer-step" id="layer2">
      <h2>[ 02 ] 动态令牌</h2>
      <p>请输入身份验证器（TOTP）生成的 6 位动态码</p>
      <div class="field">
        <label>TOTP Dynamic Code</label>
        <input type="text" id="otpCode" maxlength="6" placeholder="000000" autocomplete="off">
      </div>
      <button class="btn" onclick="AuthSystem.verifyLayer2()">校验令牌 ➔</button>
    </section>

    <!-- LAYER 3: 生物/安全密钥校验 -->
    <section class="layer-step" id="layer3">
      <h2>[ 03 ] 生物/信标校验</h2>
      <p>请点击触发硬件设备或指纹/Face ID 验证</p>
      <div class="biometric-box" onclick="AuthSystem.verifyLayer3()">
        <div class="scanner-laser"></div>
        <span>[ 点击扫描指纹 / 密钥 ]</span>
      </div>
      <p id="bioStatus" class="bio-status">等待设备响应...</p>
    </section>

  </main>

  <!-- 引入逻辑处理脚本 -->
  <script src="js/auth.js"></script>
  <script>
    // 初始化检查：如果已经登录过，直接跳过 index 进主页
    document.addEventListener("DOMContentLoaded", () => {
      AuthSystem.checkExistingSession();
    });
  </script>
</body>
</html>
